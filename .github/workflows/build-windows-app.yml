# Build the Windows Electron desktop app (native/electron) and attach the
# NSIS installer + portable exe to a GitHub Release. The desktop package
# version is separate from the bundled dsh runtime version so packaging-only
# fixes are updateable.
#
# Triggers:
#   - v* tag push: build + attach to the tag's release
#   - workflow_call: check-npm-updates orchestrates packaging changes on master
#   - workflow_dispatch: build + artifact; with versions set, also create the
#     desktop-version release (used by check-npm-updates)
name: build-windows-app

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      dsh_version:
        type: string
        required: true
      desktop_version:
        type: string
        required: true
      build_ref:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'dsh npm version to package (defaults to native/mac-app/DSH_VERSION)'
        required: false
        default: ''
      desktop_version:
        description: 'desktop installer version (defaults to tag or native/mac-app/DESKTOP_VERSION)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-windows-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows app
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.build_ref || github.sha }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Test desktop boundaries
        run: node --test native/tests/*.test.cjs

      - name: Install electron + electron-builder
        working-directory: native/electron
        run: npm install

      - name: Build and publish the app
        working-directory: native/electron
        env:
          DSH_VERSION: ${{ inputs.dsh_version }}
          DESKTOP_VERSION: ${{ inputs.desktop_version }}
          DSH_TARGET_PLATFORM: win32
          DSH_PUBLISH: never
          GH_TOKEN: ${{ github.token }}
        run: node build.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: deepseek-harness-windows
          path: native/electron/dist/*.exe
          if-no-files-found: error

      - name: Resolve release tag
        id: tag
        shell: pwsh
        env:
          DESKTOP_VERSION_INPUT: ${{ inputs.desktop_version }}
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $releaseTag = "${{ github.ref_name }}"
          } else {
            $version = $env:DESKTOP_VERSION_INPUT
            if (!$version) { $version = (Get-Content native/mac-app/DESKTOP_VERSION -Raw).Trim() }
            $releaseTag = "v$version"
          }
          "tag_name=$releaseTag" >> $env:GITHUB_OUTPUT

      - name: Upload Windows installers and update metadata
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          target_commitish: ${{ inputs.build_ref || github.sha }}
          fail_on_unmatched_files: true
          files: |
            native/electron/dist/*-setup.exe
            native/electron/dist/*-setup.exe.blockmap
            native/electron/dist/*-portable.exe
            native/electron/dist/latest.yml
