# Build the Windows Electron desktop app (native/electron) and attach the
# NSIS installer + portable exe to a GitHub Release.
#
# Triggers:
#   - v* tag push: build + attach to the tag's release
#   - master push touching native/electron: rebuild and refresh the current
#     dsh-version release automatically (packaging fixes)
#   - workflow_dispatch: build + artifact; with `dsh_version` set, also create
#     the `v<version>` release (used by check-npm-updates)
name: build-windows-app

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - 'native/electron/**'
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'dsh npm version to package (defaults to native/mac-app/DSH_VERSION)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-windows-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows app
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install electron + electron-builder
        working-directory: native/electron
        run: npm install

      - name: Build and publish the app
        working-directory: native/electron
        env:
          DSH_VERSION: ${{ github.event.inputs.dsh_version }}
          DSH_TARGET_PLATFORM: win32
          DSH_PUBLISH: never
          GH_TOKEN: ${{ github.token }}
        run: node build.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: deepseek-harness-windows
          path: native/electron/dist/*.exe
          if-no-files-found: error

      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          DSH_VERSION_INPUT: ${{ github.event.inputs.dsh_version }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            release_tag="${{ github.ref_name }}"
          else
            version="${DSH_VERSION_INPUT:-$(tr -d '[:space:]' < native/mac-app/DSH_VERSION)}"
            release_tag="v${version}"
          fi
          echo "tag_name=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release tag: ${release_tag}"

      # Upload explicitly with --clobber because electron-builder refuses to
      # replace assets in an existing published release after its age threshold.
      - name: Ensure Release and upload Windows assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            -R "$GITHUB_REPOSITORY" \
            native/electron/dist/*-setup.exe \
            native/electron/dist/*-setup.exe.blockmap \
            native/electron/dist/*-portable.exe \
            native/electron/dist/latest.yml \
            --clobber
