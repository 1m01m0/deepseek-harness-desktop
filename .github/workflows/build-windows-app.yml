# Build the Windows Electron desktop app (native/electron) and attach the
# NSIS installer + portable exe to a GitHub Release.
#
# Triggers:
#   - v* tag push: build + attach to the tag's release
#   - workflow_dispatch: build + artifact; with `dsh_version` set, also create
#     the `v<version>` release (used by check-npm-updates)
name: build-windows-app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'dsh npm version to package (defaults to native/mac-app/DSH_VERSION)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install electron + electron-builder
        working-directory: native/electron
        run: npm install

      - name: Build and publish the app
        working-directory: native/electron
        env:
          DSH_VERSION: ${{ github.event.inputs.dsh_version }}
          DSH_TARGET_PLATFORM: win32
          GH_TOKEN: ${{ github.token }}
        run: node build.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-windows
          path: native/electron/dist/*.exe
          if-no-files-found: error

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.dsh_version }}" ]; then
            echo "tag_name=v${{ github.event.inputs.dsh_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=" >> "$GITHUB_OUTPUT"
          fi

      # electron-builder --publish always (run in CI, see build.js) uploads the
      # NSIS/portable exes plus the latest.yml update feed used by electron-updater.