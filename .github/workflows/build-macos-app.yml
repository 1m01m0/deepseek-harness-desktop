# Build the self-contained macOS desktop app (native/mac-app) and attach the
# .zip installer to a GitHub Release.
#
# Triggers:
#   - v* tag push: build + zip + attach to the tag's release
#   - workflow_dispatch: build + zip + artifact; when `dsh_version` is set
#     (used by the check-npm-updates cron), also create the `v<version>` release
name: build-macos-app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'dsh npm version to package (defaults to native/mac-app/DSH_VERSION)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build macOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for icon padding
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install Pillow

      - name: Build the app
        env:
          DSH_VERSION: ${{ github.event.inputs.dsh_version }}
        run: bash native/mac-app/build.sh

      - name: Zip the app bundle
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if [ "$ver" = "$GITHUB_REF_NAME" ]; then
            ver="${{ github.event.inputs.dsh_version }}"
            if [ -z "$ver" ]; then
              ver="$(node -p "require('./native/electron/package.json').version")"
            fi
          fi
          cd dist
          zip -ry "DeepSeek-Harness-${ver}-macos-arm64.zip" "DeepSeek Harness.app"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-macos-arm64
          path: dist/DeepSeek-Harness-*-macos-arm64.zip
          if-no-files-found: error

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.dsh_version }}" ]; then
            echo "tag_name=v${{ github.event.inputs.dsh_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach to GitHub Release
        if: steps.tag.outputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          files: dist/DeepSeek-Harness-*-macos-arm64.zip
