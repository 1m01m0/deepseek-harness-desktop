# Build the self-contained macOS desktop app (native/mac-app) and attach the
# .zip installer to a GitHub Release.
#
# Triggers:
#   - v* tag push: build + zip + attach to the tag's release
#   - workflow_dispatch: build + zip + artifact; when `dsh_version` is set
#     (used by the check-npm-updates cron), also create the `v<version>` release
name: build-macos-app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'dsh npm version to package (defaults to native/mac-app/DSH_VERSION)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build macOS app
    runs-on: macos-14
    env:
      # rc releases have a large dependency graph; npm's default ~2 GB V8
      # heap can OOM before the bundled runtime is staged.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python for icon padding
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install Pillow

      - name: Build the app
        env:
          DSH_VERSION: ${{ github.event.inputs.dsh_version }}
        run: bash native/mac-app/build.sh

      - name: Zip the app bundle
        env:
          DSH_VERSION: ${{ github.event.inputs.dsh_version }}
        run: |
          # The artifact name must carry the packaged dsh runtime version (same
          # source as the app's CFBundleShortVersionString). A fork release tag
          # (v0.1.x) only names the release; letting it drive the artifact name
          # would make Sparkle/electron-updater see mismatched versions.
          ver="${DSH_VERSION:-$(tr -d '[:space:]' < native/mac-app/DSH_VERSION)}"
          cd dist
          zip -ry "DeepSeek-Harness-${ver}-macos-arm64.zip" "DeepSeek Harness.app"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: deepseek-harness-macos-arm64
          path: dist/DeepSeek-Harness-*-macos-arm64.zip
          if-no-files-found: error

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.dsh_version }}" ]; then
            echo "tag_name=v${{ github.event.inputs.dsh_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach to GitHub Release
        if: steps.tag.outputs.tag_name != ''
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          files: dist/DeepSeek-Harness-*-macos-arm64.zip

      # Sparkle feed: sign the macOS zip with the EdDSA private key and push
      # appcast.xml to the gh-pages branch (published at
      # https://1m01m0.github.io/deepseek-harness-desktop/appcast.xml).
      - name: Publish Sparkle appcast
        if: steps.tag.outputs.tag_name != ''
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ steps.tag.outputs.tag_name }}
          DSH_VERSION: ${{ github.event.inputs.dsh_version }}
        run: |
          set -euo pipefail
          echo "::group::appcast debug"
          # Same version source as the zip step and build.sh: the packaged dsh
          # runtime version. TAG only names the release the zip lives in.
          VER="${DSH_VERSION:-$(tr -d '[:space:]' < native/mac-app/DSH_VERSION)}"
          test -f "dist/DeepSeek-Harness-$VER-macos-arm64.zip" && echo "zip ok"
          curl -fsSL -o /tmp/Sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/2.9.5/Sparkle-2.9.5.tar.xz" && echo "curl ok"
          tar -xf /tmp/Sparkle.tar.xz -C /tmp && echo "tar ok"
          ls -l /tmp/bin/sign_update && echo "bin ok"
          echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_key
          chmod 600 /tmp/sparkle_key && echo "key ok"
          set +e
          SIG="$(/tmp/bin/sign_update --ed-key-file /tmp/sparkle_key "dist/DeepSeek-Harness-$VER-macos-arm64.zip" 2>&1)"
          SIGN_EXIT=$?
          set -e
          echo "sign exit=$SIGN_EXIT sig=[$SIG]"
          [ -n "$SIG" ] || { echo "sign_update produced no output"; exit 1; }
          EDSIG="$(echo "$SIG" | sed 's/.*edSignature="//' | cut -d'"' -f1)"
          LEN="$(echo "$SIG" | sed 's/.*length="//' | cut -d'"' -f1)"
          echo "edsig=[$EDSIG] len=[$LEN]"
          [ -n "$EDSIG" ] && [ -n "$LEN" ] || { echo "signature parse failed"; exit 1; }
          echo "::endgroup::"
          PUBDATE="$(date -u +'%a, %d %b %Y %H:%M:%S +0000')"
          URL="https://github.com/1m01m0/deepseek-harness-desktop/releases/download/$TAG/DeepSeek-Harness-$VER-macos-arm64.zip"
          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">'
            echo '  <channel>'
            echo '    <title>DeepSeek Harness</title>'
            echo '    <link>https://1m01m0.github.io/deepseek-harness-desktop/</link>'
            echo '    <description>DeepSeek Harness 桌面版自动更新清单</description>'
            echo '    <item>'
            echo "      <title>DeepSeek Harness $VER</title>"
            echo "      <pubDate>$PUBDATE</pubDate>"
            echo "      <sparkle:version>$VER</sparkle:version>"
            echo "      <sparkle:shortVersionString>$VER</sparkle:shortVersionString>"
            echo "      <enclosure url=\"$URL\" sparkle:edSignature=\"$EDSIG\" length=\"$LEN\"/>"
            echo '    </item>'
            echo '  </channel>'
            echo '</rss>'
          } > /tmp/appcast.xml
          git fetch origin gh-pages --depth 1
          git checkout gh-pages
          cp /tmp/appcast.xml appcast.xml
          git add appcast.xml
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -m "appcast: $TAG" || true
          git push origin gh-pages
