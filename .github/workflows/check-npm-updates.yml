# Check npm for a newer @deepseek-ai/dsh release and, when one exists, trigger
# build-macos-app (with the new version) so a fresh installer lands in a
# `v<version>` release. Runs daily and on demand.
name: check-npm-updates

on:
  schedule:
    - cron: '17 9 * * *'   # daily 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    name: Check for npm update
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.check.outputs.latest }}
      has_update: ${{ steps.check.outputs.has_update }}
    steps:
      - uses: actions/checkout@v7.0.1

      - id: check
        name: Compare npm latest vs pinned version
        run: |
          latest="$(curl -fsSL https://registry.npmjs.org/@deepseek-ai/dsh/latest | jq -r .version)"
          pinned="$(cat native/mac-app/DSH_VERSION)"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned"
          if [ "$latest" = "$pinned" ]; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            echo "up to date ($latest)"
          else
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "update available: $pinned -> $latest"
          fi

  trigger-build:
    name: Bump pin and trigger builds
    needs: check
    if: needs.check.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Bump DSH_VERSION pin
        env:
          NEXT_VERSION: ${{ needs.check.outputs.latest }}
        run: |
          # Close the loop: without this commit the daily check keeps seeing a
          # mismatch and re-triggers the same builds forever. Trade-off: if a
          # build below fails after this commit, re-trigger it manually.
          printf '%s\n' "$NEXT_VERSION" > native/mac-app/DSH_VERSION
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add native/mac-app/DSH_VERSION
          git commit -m "chore: bump DSH_VERSION to $NEXT_VERSION" || echo "pin already at $NEXT_VERSION"
          git pull --rebase origin master || echo "rebase failed; push below will fail loudly"
          git push origin master

      - name: Trigger macOS / Windows / Linux builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in build-macos-app build-windows-app build-linux-app; do
            gh workflow run "$wf.yml" \
              -R "${{ github.repository }}" \
              -f dsh_version="${{ needs.check.outputs.latest }}"
          done
          echo "triggered all three platform builds for dsh ${{ needs.check.outputs.latest }}"
