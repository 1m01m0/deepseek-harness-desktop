# A target pin is not proof of a release. Reconcile missing installers/feeds on
# every run, and wait for the reusable platform workflows before reporting success.
name: check-npm-updates

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'native/**'
      - '.github/workflows/build-*-app.yml'
      - '.github/workflows/check-npm-updates.yml'
  workflow_run:
    workflows: [sync-upstream]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: check-npm-updates
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      runtime: ${{ steps.plan.outputs.runtime }}
      desktop: ${{ steps.plan.outputs.desktop }}
      ref: ${{ steps.pin.outputs.ref }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Test desktop boundaries
        run: node --test native/tests/*.test.cjs
      - name: Reconcile registry and published assets
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGING_CHANGED: ${{ github.event_name == 'push' }}
        run: node native/release-plan.cjs
      - name: Record target versions
        id: pin
        env:
          RUNTIME: ${{ steps.plan.outputs.runtime }}
          DESKTOP: ${{ steps.plan.outputs.desktop }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RUNTIME" > native/mac-app/DSH_VERSION
          printf '%s\n' "$DESKTOP" > native/mac-app/DESKTOP_VERSION
          if ! git diff --quiet -- native/mac-app/DSH_VERSION native/mac-app/DESKTOP_VERSION; then
            git config user.name github-actions
            git config user.email actions@github.com
            git add native/mac-app/DSH_VERSION native/mac-app/DESKTOP_VERSION
            git commit -m "chore: target desktop $DESKTOP (dsh $RUNTIME)"
            # A concurrent source change must be reviewed by the next run,
            # never silently overwrite or publish against the wrong revision.
            git push origin HEAD:master
          fi
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  macos:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/build-macos-app.yml
    with:
      dsh_version: ${{ needs.plan.outputs.runtime }}
      desktop_version: ${{ needs.plan.outputs.desktop }}
      build_ref: ${{ needs.plan.outputs.ref }}
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  windows:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/build-windows-app.yml
    with:
      dsh_version: ${{ needs.plan.outputs.runtime }}
      desktop_version: ${{ needs.plan.outputs.desktop }}
      build_ref: ${{ needs.plan.outputs.ref }}

  linux:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/build-linux-app.yml
    with:
      dsh_version: ${{ needs.plan.outputs.runtime }}
      desktop_version: ${{ needs.plan.outputs.desktop }}
      build_ref: ${{ needs.plan.outputs.ref }}

  verify:
    needs: [plan, macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Verify published assets and update feeds
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP: ${{ needs.plan.outputs.desktop }}
        run: |
          # Allow bounded propagation time for GitHub Pages and release assets.
          for attempt in 1 2 3 4 5 6; do
            node native/release-plan.cjs --verify "$DESKTOP" && exit 0
            sleep 10
          done
          exit 1
