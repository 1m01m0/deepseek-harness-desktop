# Build the Linux Electron desktop app (native/electron) and attach the
# AppImage to a GitHub Release. The desktop package version is separate from
# the bundled dsh runtime version so packaging-only fixes are updateable.
#
# Triggers:
#   - v* tag push: build + attach to the tag's release
#   - workflow_dispatch: build + artifact; with versions set, also create the
#     desktop-version release (used by check-npm-updates)
name: build-linux-app

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      dsh_version:
        type: string
        required: true
      desktop_version:
        type: string
        required: true
      build_ref:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'dsh npm version to package (defaults to native/mac-app/DSH_VERSION)'
        required: false
        default: ''
      desktop_version:
        description: 'desktop installer version (defaults to tag or native/mac-app/DESKTOP_VERSION)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-linux-app
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux app
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.build_ref || github.sha }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Test desktop boundaries
        run: node --test native/tests/*.test.cjs

      - name: Install electron + electron-builder
        working-directory: native/electron
        run: npm install

      - name: Build and publish the app
        working-directory: native/electron
        env:
          DSH_VERSION: ${{ inputs.dsh_version }}
          DESKTOP_VERSION: ${{ inputs.desktop_version }}
          DSH_TARGET_PLATFORM: linux
          DSH_PUBLISH: never
          GH_TOKEN: ${{ github.token }}
        run: node build.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: deepseek-harness-linux
          path: native/electron/dist/*.AppImage
          if-no-files-found: error

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.desktop_version }}" ]; then
            echo "tag_name=v${{ inputs.desktop_version }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.dsh_version }}" ]; then
            echo "tag_name=v$(tr -d '[:space:]' < native/mac-app/DESKTOP_VERSION)" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Linux assets
        if: steps.tag.outputs.tag_name != ''
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          target_commitish: ${{ inputs.build_ref || github.sha }}
          fail_on_unmatched_files: true
          files: |
            native/electron/dist/*.AppImage
            native/electron/dist/latest-linux.yml
